include: /build/gitlab-ci.yml

default:
  # cancel whole pipeline on a new commit on the same ref
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"  # TODO do not interrupt?
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

variables:
  PROJECT_PATH: "sosy-lab/software/cpachecker"
  GH_REF: "github.com/sosy-lab/cpachecker"
  # Version of https://gitlab.com/sosy-lab/software/refaster/ to use
  REFASTER_REPO_REVISION: bba447e6b8e1df7ef8cdb6864319a4569e3e275b
  # Needs to be synchronized with Error Prone version in lib/ivy.xml
  REFASTER_VERSION: 2.27.1
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  npm_config_cache: "${CI_PROJECT_DIR}/.cache/npm"
  npm_config_prefer_offline: "true"

.pip-cache: &pip-cache
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - ".cache/pip"

.node-cache: &node-cache
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - ".cache/npm"

.binary_check: &binary_check
  stage: checks

.configuration-checks: &configuration-checks
  <<: *binary_check
  script: "ant $ANT_PROPS_CHECKS configuration-checks"
  artifacts:
    paths:
      - "ConfigurationChecks.html"
      - "hs_err_pid*.log"
    when: always
    reports:
      junit: "output/configuration-checks/TESTS-TestSuites.xml"

configuration-checks:jdk-17:
  <<: *configuration-checks
  dependencies:
    - build-dependencies
    - build:jdk-17
  needs:
    - build-dependencies
    - build:jdk-17
  image: ${CI_REGISTRY_IMAGE}/test:jdk-17

configuration-checks:jdk-22:
  <<: *configuration-checks
  dependencies:
    - build-dependencies
    - build:jdk-22
  needs:
    - build-dependencies
    - build:jdk-22
  image: ${CI_REGISTRY_IMAGE}/test:jdk-22


configuration-documentation:
  <<: *binary_check
  script:
    - "cp doc/ConfigurationOptions.txt doc/ConfigurationOptions.txt.old"
    - "ant $ANT_PROPS_CHECKS build-documentation -Ddocumentation.uptodate=false"
    - "diff doc/ConfigurationOptions.txt.old doc/ConfigurationOptions.txt"
  dependencies:
    - build-dependencies
    - build:jdk-17
  needs:
    - build-dependencies
    - build:jdk-17


configuration-plot:
  stage: checks
  script:
    - "mkdir -p output"
    - "touch output/AssumptionAutomaton.txt"
    - "scripts/configViz.py > ConfigurationPlot.dot"
    - "dot -Tsvg ConfigurationPlot.dot -O"
  dependencies: []
  needs: []
  artifacts:
    paths:
      - "ConfigurationPlot.dot.svg"


forbidden-apis:
  <<: *binary_check
  script: "ant $ANT_PROPS_CHECKS forbiddenapis"
  dependencies:
    - build-dependencies
    - build:jdk-17
  needs:
    - build-dependencies
    - build:jdk-17


check-code-patterns:
  stage: checks
  script: "build/check-code-patterns.sh"
  dependencies: []
  needs: []
  image: ubuntu:20.04


.python-unit-tests: &python-unit-tests
  <<: *binary_check
  script: "ant $ANT_PROPS_CHECKS python-unit-tests"

python-unit-tests:jdk-17:
  <<: *python-unit-tests
  dependencies:
    - build-dependencies
    - build:jdk-17
  needs:
    - build-dependencies
    - build:jdk-17
  image: ${CI_REGISTRY_IMAGE}/test:jdk-17

python-unit-tests:jdk-22:
  <<: *python-unit-tests
  dependencies:
    - build-dependencies
    - build:jdk-22
  needs:
    - build-dependencies
    - build:jdk-22
  image: ${CI_REGISTRY_IMAGE}/test:jdk-22


javascript-build:
  stage: checks
  dependencies: []
  needs: []
  image: ${CI_REGISTRY_IMAGE}/test:node
  before_script:
    - cd src/org/sosy_lab/cpachecker/core/counterexample/
    - npm ci
  script:
    - npm run build
    - git diff --stat --exit-code
  artifacts:
    paths:
      -  src/org/sosy_lab/cpachecker/core/counterexample/build
    when: on_failure
  <<: *node-cache

javascript-unit-tests:
  when: manual  # TODO see fixes in LMU upstream
  stage: checks
  dependencies: []
  needs: []
  image: ${CI_REGISTRY_IMAGE}/test:node
  before_script:
    - cd src/org/sosy_lab/cpachecker/core/counterexample/
    - npm ci
  script:
    - npm test
  cache:
    paths:
    - "src/org/sosy_lab/cpachecker/core/counterexample/node_modules/"
  artifacts:
    paths:
      - src/org/sosy_lab/cpachecker/core/counterexample/unit_testing_report.html
    when: always
  <<: *node-cache

javascript-eslint:
  stage: checks
  dependencies: []
  needs: []
  image: ${CI_REGISTRY_IMAGE}/test:node
  before_script:
    - cd src/org/sosy_lab/cpachecker/core/counterexample/
    - npm ci
  script:
    - npm run lint
  <<: *node-cache


build-docker:test:java-node:
  extends: .build-docker
  variables:
    DOCKERFILE: build/gitlab-ci.Dockerfile.java-node
    IMAGE: /test:java-node

build-docker:test:node:
  extends: .build-docker
  variables:
    DOCKERFILE: build/gitlab-ci.Dockerfile.node
    IMAGE: /test:node

build-docker:release:
  extends: .build-docker
  variables:
    DOCKERFILE: build/Dockerfile.release
    TAG: "3.0"
    EXTRA_ARGS: "--destination $CI_REGISTRY_IMAGE:latest --destination docker.io/sosylab/cpachecker:latest"
  rules:
    - when: never


javascript-e2e-tests:
  when: manual  # TODO see fixes in LMU upstream
  stage: checks
  dependencies:
    - build-dependencies
    - build:jdk-17
  needs:
    - build-dependencies
    - build:jdk-17
  image: ${CI_REGISTRY_IMAGE}/test:java-node
  before_script:
      # generate example report
    - bin/cpachecker -predicateAnalysis test/programs/simple/SSAMap-bug.c
    - cd src/org/sosy_lab/cpachecker/core/counterexample/
    - npm ci
    - "npx webdriver-manager update --versions.chrome $(dpkg-query --showformat='${Version}' --show google-chrome-stable)"
  script:
    - npm run e2e-test
  cache:
    paths:
    - src/org/sosy_lab/cpachecker/core/counterexample/node_modules/
  artifacts:
    paths:
      - output/Counterexample.1.html
      - src/org/sosy_lab/cpachecker/core/counterexample/e2e-tests-report
    when: always


# Checks for Python code
check-format-python:
  stage: checks
  dependencies: []
  needs: []
  image: python
  before_script:
    - pip install 'black[jupyter]<25'
  script:
    - black . --check --diff
  <<: *pip-cache

flake8:
  # TODO Remove after we merge changes from LMU upstream trunk, as
  #  some problems were not introduced by us, and were hopefully already resolved.
  allow_failure: true
  stage: checks
  dependencies: []
  needs: []
  image: python:3.8
  before_script:
    - "pip install 'flake8<6' flake8-awesome"
  script:
    - flake8
  <<: *pip-cache


build-tar:
  stage: checks
  dependencies:
    - build-dependencies
    - build:jdk-17
  needs:
    - build-dependencies
    - build:jdk-17
  script: "ant $ANT_PROPS_CHECKS dist-unix -Dnamet=cpachecker"
  artifacts:
    paths:
      - "cpachecker.tar.bz2"

deploy-docker:
  stage: deploy
  dependencies:
    - build-tar
  needs:
    - build-tar
  extends: .build-docker
  variables:
    DOCKERFILE: build/Dockerfile.dev
    IMAGE: ":$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    EXTRA_ARGS: "--context dir://."


# No coverage is computed for CPAchecker
unit-tests:jdk-17:
  script: "ant $ANT_PROPS_CHECKS unit-tests"
  artifacts:
    reports:
      junit: "output/junit/TESTS-TestSuites.xml"

unit-tests:jdk-21:
  script: "ant $ANT_PROPS_CHECKS unit-tests"
  artifacts:
    reports:
      junit: "output/junit/TESTS-TestSuites.xml"

unit-tests:jdk-22:
  script: "ant $ANT_PROPS_CHECKS unit-tests"
  artifacts:
    reports:
      junit: "output/junit/TESTS-TestSuites.xml"


# Override Java version for some jobs
image: ${CI_REGISTRY_IMAGE}/test:jdk-17

spotbugs:
  dependencies:
    - build-dependencies
    - build:jdk-17
  needs:
    - build-dependencies
    - build:jdk-17

refaster:
  image: ${CI_REGISTRY_IMAGE}/test:jdk-17


# Disable some checks because they are not used for CPAchecker
javadoc:
  only: []


generate-child-pipeline:
  image:
    name: python:3.8
    entrypoint: [""]
  stage: integration_tests
  needs:
    - job: build-tar  # so the child pipeline does not start early
      artifacts: false
  script:
    # check xml test sets and generate child pipeline for the tests
    - pip install defusedxml
    - python3 gitlab-ci/check-and-generate-integration-tests-pipeline.py
  artifacts:
    paths:
      - 'generated-ci.yml'

run-integration-tests-pipeline:
  stage: integration_tests
  needs:
    - generate-child-pipeline
  trigger:
    include:
      - artifact: 'generated-ci.yml'
        job: generate-child-pipeline
    strategy: depend
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
    PARENT_CI_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
