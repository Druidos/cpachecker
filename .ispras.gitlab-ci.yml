.tests: &tests
  stage: tests
  dependencies:
    - build-dependencies
    - build
  needs:
    - build-dependencies
    - build
  interruptible: true
  artifacts:
    paths:
      - "*-log.txt"
    when: on_failure
  before_script:
    - if [ $CI_PIPELINE_SOURCE != 'web' ] ; then FLAGS="--is_wip" ; fi
    - if ! [ -z "$JOB_NAME" ] ; then JOB_NAME_ARG="--job_name=$JOB_NAME" ; else JOB_NAME_ARG="" ; fi
  script:
    - 'echo ci-test-run.py $FLAGS "$JOB_NAME_ARG" $JOB_FILE_DESC'
    - 'python3 ci-test-run.py $FLAGS "$JOB_NAME_ARG" $JOB_FILE_DESC'

.full-tests: &full-tests
  <<: *tests
  only:
    - web

simple-tests:
  <<: *tests
  variables:
    JOB_FILE_DESC: ci-config/simple-job.yml

product-lines:
  <<: *tests
  variables:
    JOB_FILE_DESC: ci-config/product-lines-job.yml

