build-tar:
  stage: checks
  dependencies:
    - build-dependencies
    - build
  needs:
    - build-dependencies
    - build
  script: "ant $ANT_PROPS_CHECKS dist-unix -Dnamet=cpachecker"
  artifacts:
    paths:
      - "cpachecker.tar.bz2"
  rules:
    - if: $CI_COMMIT_BRANCH == $MASTER_BRANCH
      when: always

